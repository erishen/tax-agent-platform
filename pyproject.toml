[project]
name = "tax-agent-platform"
version = "0.1.0"
description = "Enterprise tax advisory platform demonstrating FastAPI + RAG + Multi-Agent + Multi-tenancy (interview knowledge points)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=2.0.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax_agent_platform"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B008: FastAPI 的 Depends() 按框架约定写在参数默认值里
# DTZ007/DTZ011: 法规生效/过期日、热度加权的“多少天前”都是纯日历日期（date，无时区语义），
# date.today() 与 naive strptime 在此正是正确用法
ignore = ["B008", "DTZ007", "DTZ011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# starlette 1.3.x prefers the `httpx2` fork and warns when the `httpx` package is
# used by its TestClient. This is a framework-level, cosmetic deprecation (tests pass
# regardless); we filter it instead of pulling in the `httpx2`/`httpcore2` fork.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
