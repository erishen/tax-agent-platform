name: CI Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # dev 依赖定义在 [dependency-groups]（PEP 735），pip install -e ".[dev]" 装不到，
      # 所以统一走 uv sync --group dev，与本地开发保持一致
      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run tests with pytest
        run: uv run pytest -v
